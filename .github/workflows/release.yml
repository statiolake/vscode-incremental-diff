# On a v* tag: builds the prebuilt cores (scripts/release-assets.sh) and
# publishes them, with SHA256SUMS, as that tag's GitHub release, where
# build.lua fetches them. The tag must match package.json's version; the
# release notes are the tag's message.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: The tag is package.json's version
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      - name: Build the cores
        run: scripts/release-assets.sh release
      - name: Check the host's core
        run: |
          tar -xzf release/incremental-diff-linux-amd64.tar.gz -O > /tmp/core && chmod +x /tmp/core
          test "v$(/tmp/core version)" = "$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git for-each-ref --format='%(contents)' "refs/tags/$TAG" > notes.md
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then echo "Release $TAG" > notes.md; fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/*.tar.gz release/SHA256SUMS --clobber
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md release/*.tar.gz release/SHA256SUMS
          fi
